<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <h2>SecureBank</h2>
    <button onclick="logout()">Logout</button>
</nav>

<main class="dashboard">
    <div class="welcome-card">
        <h1>Account Dashboard</h1>
        <p>Welcome, <strong id="customerNameDisplay">Customer</strong></p>
        <p>Account Number: <strong id="accountNumberDisplay"></strong></p>
    </div>

    <div class="balance-card">
        <h3>Current Balance</h3>
        <h1 id="balance">₹0.00</h1>
    </div>

    <div class="transaction-box">
        <h3>Deposit / Withdraw</h3>
        <input type="number" id="amount" placeholder="Enter amount" min="1">
        <button onclick="deposit()">Deposit</button>
        <button onclick="withdraw()">Withdraw</button>
        <p id="message" class="message"></p>
    </div>

    <div class="history-box">
        <div class="history-heading">
            <h3>Transaction History</h3>
            <button onclick="loadTransactions()">Refresh</button>
        </div>
        <div id="transactionList"></div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
